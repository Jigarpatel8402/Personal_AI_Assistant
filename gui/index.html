<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NovaAI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- CENTER BRAND -->
  <div id="brand">
    <div class="hex"></div>
    <span>JARVIS AI</span>
  </div>

  <!-- CHAT AREA -->
  <div id="chat"></div>

  <!-- INPUT BAR (SAME ONE MOVES DOWN) -->
  <div id="input-bar">
    <input id="input" placeholder="Type command">
    <button id="mic" aria-label="mic input">
      <img src="mic.png" alt="Send" draggable="false">
    </button>
    <button id="send" aria-label="Send message">
      <img src="send.png" alt="Send" draggable="false">
    </button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
