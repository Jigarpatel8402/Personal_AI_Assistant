<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-hex" viewBox="0 0 24 24"><path d="M7 3h10l5 9-5 9H7l-5-9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12z" fill="currentColor"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M3 20.5v-6.7l9-1.8-9-1.8V3.5L22 12z" fill="currentColor"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14m0 0l-6-6m6 6l6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<div id="app">
  <aside id="sidebar" aria-label="Conversations">
    <div class="side-head">
      <svg class="logo"><use href="#i-hex"/></svg><span>JARVIS AI</span>
    </div>
    <button id="new-chat" class="btn-new"><svg><use href="#i-plus"/></svg>New chat</button>
    <nav id="history"></nav>
    <button id="theme" class="btn-ghost"><svg><use href="#i-sun"/></svg>Switch theme</button>
  </aside>
  <div id="scrim"></div>

  <main id="main" class="empty">
    <header id="topbar">
      <button id="menu" class="icon-btn" aria-label="Toggle sidebar" title="Toggle sidebar"><svg><use href="#i-menu"/></svg></button>
      <span id="title">New chat</span>
      <span id="health" class="health" title="Backend status"></span>
    </header>

    <section id="landing">
      <svg class="logo big"><use href="#i-hex"/></svg>
      <h1>What should I do for you?</h1>
      <div id="chips">
        <button class="chip">Open Chrome</button>
        <button class="chip">What's my battery level?</button>
        <button class="chip">Write a Python function to sort a list</button>
      </div>
    </section>

    <section id="chat" aria-live="polite"><div id="thread"></div></section>
    <button id="jump" aria-label="Jump to latest"><svg><use href="#i-down"/></svg></button>

    <footer id="composer-wrap">
      <div id="composer">
        <textarea id="input" rows="1" placeholder="Type a command or ask anything" aria-label="Message"></textarea>
        <span id="listening" hidden>Listening…</span>
        <button id="mic" class="icon-btn" aria-label="Hold to talk (Ctrl+M)" title="Hold to talk (Ctrl+M)"><svg><use href="#i-mic"/></svg></button>
        <button id="send" aria-label="Send message" title="Send" disabled><svg><use href="#i-send"/></svg></button>
      </div>
      <p class="hint">Enter to send · Shift+Enter for a new line</p>
    </footer>
  </main>
</div>
<div id="toasts" role="status" aria-live="polite"></div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
